<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEZOO New Orders</title>

  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --green:#16c85c;
      --green-dark:#0a9e43;
      --green-soft:#effcf4;
      --red:#e84242;
      --red-soft:#fff1f1;
      --orange:#f59e0b;
      --blue:#2475ff;
      --purple:#7c3aed;
      --text:#17191f;
      --muted:#777d86;
      --line:#e9ebef;
      --page:#fff;
      --soft:#f7f8f9;
      --dark:#15171b;
    }

    body{
      min-height:100vh;
      background:var(--page);
      color:var(--text);
      font-family:"Inter",Arial,sans-serif;
      padding-bottom:84px;
    }

    button,select{font:inherit}
    button{cursor:pointer}

    /* TOP */
    /* TABS */
    .tabs{
      display:flex;
      align-items:center;
      gap:24px;
      padding:0 18px;
      height:54px;
      border-bottom:1px solid var(--line);
      overflow:auto;
      background:#fff;
      position:sticky;
      top:0;
      z-index:90;
    }

    .tab{
      height:54px;
      border:0;
      background:transparent;
      color:#888d96;
      position:relative;
      font-size:11px;
      font-weight:800;
      white-space:nowrap;
      display:flex;
      align-items:center;
      gap:7px;
    }

    .tab.active{
      color:var(--text);
    }

    .tab.active::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:-1px;
      height:2px;
      background:var(--green);
      border-radius:10px 10px 0 0;
    }

    .count{
      min-width:20px;
      height:20px;
      padding:0 6px;
      border-radius:999px;
      background:#f0f1f3;
      color:#666;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:9px;
    }

    .tab.active .count{
      background:var(--green-soft);
      color:var(--green-dark);
    }

    /* ORDER LIST */
    .ordersList{
      width:100%;
    }

    .orderItem{
      background:#fff;
      border-bottom:10px solid #f5f6f7;
    }

    .orderHead{
      padding:16px 18px 13px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      border-bottom:1px solid var(--line);
    }

    .orderId{
      font-size:12px;
      font-weight:800;
      line-height:1.4;
      word-break:break-word;
    }

    .orderTime{
      margin-top:4px;
      color:#8a8f97;
      font-size:9px;
    }

    .status{
      border-radius:999px;
      padding:7px 10px;
      font-size:9px;
      font-weight:800;
      text-transform:capitalize;
      white-space:nowrap;
      display:inline-flex;
      align-items:center;
      gap:6px;
    }

    .status::before{
      content:"";
      width:6px;
      height:6px;
      border-radius:50%;
      background:currentColor;
      opacity:.9;
    }

    .status.new,.status.placed,.status.pending{
      background:#edf4ff;
      color:#1769c8;
    }

    .status.confirmed,.status.packed{
      background:#f3edff;
      color:#7040c3;
    }

    .status.on_the_way,.status.out_for_delivery{
      background:#fff3e8;
      color:#c96400;
    }

    .status.cancelled,.status.canceled{
      background:var(--red-soft);
      color:var(--red);
    }

    .status.default{
      background:#f1f2f4;
      color:#60646c;
    }

    /* CUSTOMER */
    .customerSection{
      padding:14px 18px;
      border-bottom:1px solid var(--line);
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:14px;
      align-items:start;
    }

    .sectionLabel{
      font-size:8px;
      color:#989da5;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.55px;
      margin-bottom:7px;
    }

    .customerName{
      font-size:13px;
      font-weight:800;
    }

    .customerLine{
      margin-top:6px;
      color:#676c75;
      font-size:10px;
      line-height:1.5;
      display:flex;
      gap:7px;
      align-items:flex-start;
    }

    .customerLine i{
      width:13px;
      color:#8d929a;
      margin-top:2px;
    }

    .customerLine a{
      color:inherit;
      text-decoration:none;
    }

    .mapBtn{
      width:40px;
      height:40px;
      border:0;
      border-radius:50%;
      background:var(--green-soft);
      color:var(--green-dark);
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      font-size:14px;
    }

    /* PRODUCTS */
    .productsSection{
      padding:14px 18px 4px;
      border-bottom:1px solid var(--line);
    }

    .productRow{
      display:grid;
      grid-template-columns:62px minmax(0,1fr) auto;
      gap:12px;
      align-items:center;
      padding:10px 0 13px;
      border-bottom:1px solid #f0f1f3;
    }

    .productRow:last-child{
      border-bottom:0;
    }

    .productImage{
      width:62px;
      height:62px;
      border-radius:12px;
      background:#f7f8f9;
      border:1px solid #eceef1;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      color:#aaa;
    }

    .productImage img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .productName{
      font-size:11px;
      line-height:1.4;
      font-weight:800;
    }

    .productPack{
      margin-top:5px;
      color:#858a93;
      font-size:9px;
    }

    .productMeta{
      text-align:right;
      min-width:62px;
    }

    .qty{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:35px;
      height:26px;
      padding:0 8px;
      border-radius:8px;
      background:#17191d;
      color:#fff;
      font-size:9px;
      font-weight:800;
    }

    .linePrice{
      margin-top:6px;
      font-size:10px;
      font-weight:800;
      white-space:nowrap;
    }

    .singlePrice{
      margin-top:3px;
      color:#969ba3;
      font-size:8px;
      white-space:nowrap;
    }

    /* BILL */
    .billSection{
      padding:15px 18px;
      border-bottom:1px solid var(--line);
    }

    .billRow{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      padding:6px 0;
      font-size:10px;
      color:#6d727b;
    }

    .billRow strong{
      color:#2d3036;
      font-weight:750;
    }

    .billTotal{
      margin-top:7px;
      padding-top:12px;
      border-top:1px dashed #dfe2e6;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .billTotal span{
      font-size:11px;
      font-weight:800;
    }

    .billTotal strong{
      font-size:21px;
      font-weight:800;
      letter-spacing:-.4px;
    }

    /* STATUS ACTION */
    .statusSection{
      padding:14px 18px 17px;
      display:flex;
      align-items:center;
      gap:9px;
    }

    .statusSelect{
      flex:1;
      height:42px;
      border:1px solid var(--line);
      border-radius:11px;
      background:#fafafa;
      color:#333;
      padding:0 11px;
      outline:none;
      font-size:10px;
      font-weight:700;
    }

    .updateBtn{
      height:42px;
      padding:0 16px;
      border:0;
      border-radius:11px;
      background:var(--dark);
      color:#fff;
      font-size:10px;
      font-weight:800;
    }

    .updateBtn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    /* EMPTY */
    .empty{
      min-height:420px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:40px 20px;
    }

    .emptyIcon{
      width:60px;
      height:60px;
      border-radius:50%;
      background:#f3f4f5;
      color:#a1a6ae;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:21px;
      margin-bottom:13px;
    }

    .empty h3{
      font-size:15px;
      font-weight:800;
    }

    .empty p{
      max-width:320px;
      margin-top:6px;
      color:#888d95;
      font-size:10px;
      line-height:1.5;
    }

    /* BOTTOM NAV */
    .bottomNav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      height:72px;
      background:#fff;
      border-top:1px solid var(--line);
      display:grid;
      grid-template-columns:1fr 1fr;
      z-index:200;
    }

    .bottomBtn{
      border:0;
      background:#fff;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
      color:#92979f;
      font-size:9px;
      font-weight:800;
      position:relative;
    }

    .bottomBtn i{
      font-size:17px;
    }

    .bottomBtn.active{
      color:var(--green-dark);
    }

    .bottomBtn.active::before{
      content:"";
      width:24px;
      height:3px;
      border-radius:999px;
      background:var(--green);
      position:absolute;
      top:0;
    }

    .bottomBadge{
      position:absolute;
      top:8px;
      margin-left:25px;
      min-width:17px;
      height:17px;
      padding:0 5px;
      border-radius:999px;
      background:#ef4444;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:7px;
      font-weight:800;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:88px;
      z-index:500;
      transform:translate(-50%,20px);
      background:#17191d;
      color:#fff;
      padding:11px 15px;
      border-radius:11px;
      font-size:10px;
      font-weight:750;
      opacity:0;
      visibility:hidden;
      transition:.2s;
      max-width:calc(100% - 28px);
      text-align:center;
    }

    .toast.show{
      opacity:1;
      visibility:visible;
      transform:translate(-50%,0);
    }

    .toast.error{
      background:#d93636;
    }

    @media(min-width:850px){
      body{background:#f5f6f8}
      .tabs,.ordersList{
        max-width:900px;
        margin-left:auto;
        margin-right:auto;
      }
      .tabs,.ordersList{background:#fff}
      .ordersList{border-left:1px solid var(--line);border-right:1px solid var(--line)}
      .bottomNav{
        left:50%;
        transform:translateX(-50%);
        max-width:900px;
        border-left:1px solid var(--line);
        border-right:1px solid var(--line);
      }
    }
  </style>
</head>
<body>

  <nav class="tabs">
    <button class="tab active" type="button" data-tab="new">
      New Orders <span class="count" id="newCount">0</span>
    </button>
    <button class="tab" type="button" data-tab="cancelled">
      Cancelled <span class="count" id="cancelledCount">0</span>
    </button>
  </nav>

  <main id="ordersList" class="ordersList"></main>

  <nav class="bottomNav">
    <button class="bottomBtn active" type="button" data-bottom="new">
      <i class="fa-solid fa-bag-shopping"></i>
      <span>Orders</span>
      <span class="bottomBadge" id="bottomNewCount">0</span>
    </button>

    <button class="bottomBtn" type="button" data-bottom="cancelled">
      <i class="fa-solid fa-ban"></i>
      <span>Cancelled</span>
      <span class="bottomBadge" id="bottomCancelledCount">0</span>
    </button>
  </nav>

  <div id="toast" class="toast"></div>

  <script>
    const SUPABASE_URL = "https://ycqwdeiykbkfmmlpgdzd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-4RzQVudUy_VsvSpHTxNfg_hrdsQW0j";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const PAGE_OPENED_AT = new Date().toISOString();

    const ORDER_TABLES = [
      {name:"cash_delivery_orders", payment:"Cash"},
      {name:"upi_orders", payment:"UPI"}
    ];

    let activeTab = "new";
    let orders = [];
    const productCache = {};

    const ordersList = document.getElementById("ordersList");
    const newCount = document.getElementById("newCount");
    const cancelledCount = document.getElementById("cancelledCount");
    const bottomNewCount = document.getElementById("bottomNewCount");
    const bottomCancelledCount = document.getElementById("bottomCancelledCount");
    const toast = document.getElementById("toast");

    function safe(value){
      return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function number(value){
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    }

    function money(value){
      return "₹" + number(value).toLocaleString("en-IN",{
        minimumFractionDigits:0,
        maximumFractionDigits:2
      });
    }

    function normalizeStatus(order){
      return String(order.order_status || order.status || "placed")
        .trim()
        .toLowerCase()
        .replaceAll(" ","_");
    }

    function cancelled(order){
      return ["cancelled","canceled"].includes(normalizeStatus(order));
    }

    function delivered(order){
      return normalizeStatus(order) === "delivered";
    }

    function showToast(message,error=false){
      toast.textContent = message;
      toast.classList.toggle("error",error);
      toast.classList.add("show");

      clearTimeout(toast.timer);
      toast.timer = setTimeout(()=>{
        toast.classList.remove("show");
      },2200);
    }

    function statusClass(status){
      const allowed = [
        "new","placed","pending","confirmed","packed",
        "on_the_way","out_for_delivery","cancelled","canceled"
      ];
      return allowed.includes(status) ? status : "default";
    }

    function formatDate(value){
      if(!value) return "Just now";

      const d = new Date(value);
      if(Number.isNaN(d.getTime())) return "";

      return d.toLocaleString("en-IN",{
        day:"2-digit",
        month:"short",
        hour:"2-digit",
        minute:"2-digit"
      });
    }

    function orderKey(order){
      return `${order._table}:${order.id ?? order.order_id}`;
    }

    function addOrUpdateOrder(order){
      const key = orderKey(order);
      const index = orders.findIndex(x=>orderKey(x)===key);

      if(index >= 0){
        orders[index] = order;
      }else{
        orders.unshift(order);
      }

      orders.sort((a,b)=>{
        return new Date(b.created_at || 0) - new Date(a.created_at || 0);
      });
    }

    function mapLink(order){
      const lat = Number(order.latitude);
      const lng = Number(order.longitude);

      if(Number.isFinite(lat) && Number.isFinite(lng) && lat !== 0 && lng !== 0){
        return `https://www.google.com/maps?q=${encodeURIComponent(lat)},${encodeURIComponent(lng)}`;
      }

      const place = [
        order.address,
        order.village,
        order.city,
        order.pincode
      ].filter(Boolean).join(", ");

      if(!place) return "";

      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place)}`;
    }

    async function fetchProducts(items){
      if(!Array.isArray(items) || !items.length) return [];

      const grouped = {};

      for(const item of items){
        const table = String(
          item.product_table ||
          item.table_name ||
          item.table ||
          ""
        ).trim();

        const id = Number(item.product_id ?? item.id);

        const qty = number(
          item.qty ??
          item.quantity ??
          item.count ??
          1
        ) || 1;

        if(!table || !Number.isFinite(id)) continue;

        if(!grouped[table]) grouped[table] = [];
        grouped[table].push({id,qty});
      }

      const finalProducts = [];

      for(const [table, rows] of Object.entries(grouped)){
        const ids = [...new Set(rows.map(x=>x.id))];

        const missingIds = ids.filter(id=>{
          return !productCache[`${table}_${id}`];
        });

        if(missingIds.length){
          const {data,error} = await db
            .from(table)
            .select("id,name,name_telugu,quantity,unit,original_price,discount_price,image1")
            .in("id",missingIds);

          if(error){
            console.error("Product load error:",table,error);
          }else{
            for(const product of (data || [])){
              productCache[`${table}_${product.id}`] = {
                ...product,
                product_table:table
              };
            }
          }
        }

        for(const row of rows){
          const product = productCache[`${table}_${row.id}`];

          if(product){
            finalProducts.push({
              ...product,
              ordered_qty:row.qty
            });
          }else{
            finalProducts.push({
              id:row.id,
              product_table:table,
              ordered_qty:row.qty,
              _missing:true
            });
          }
        }
      }

      return finalProducts;
    }

    async function enrichOrder(order){
      const items = Array.isArray(order.items) ? order.items : [];
      order._products = await fetchProducts(items);
      return order;
    }

    function renderProducts(products){
      if(!products || !products.length){
        return `
          <div style="padding:12px 0 16px;color:#90959d;font-size:10px">
            Product details not available.
          </div>
        `;
      }

      return products.map(product=>{
        const qty = number(product.ordered_qty) || 1;

        if(product._missing){
          return `
            <div class="productRow">
              <div class="productImage">
                <i class="fa-solid fa-box"></i>
              </div>

              <div>
                <div class="productName">
                  Product ID ${safe(product.id)}
                </div>
                <div class="productPack">
                  ${safe(product.product_table)}
                </div>
              </div>

              <div class="productMeta">
                <div class="qty">×${qty}</div>
              </div>
            </div>
          `;
        }

        const eachPrice = number(
          product.discount_price ||
          product.original_price
        );

        const totalLine = eachPrice * qty;

        const packText = [
          product.quantity,
          product.unit
        ].filter(Boolean).join(" ");

        return `
          <div class="productRow">

            <div class="productImage">
              ${
                product.image1
                ? `<img src="${safe(product.image1)}" alt="${safe(product.name || "Product")}" loading="lazy">`
                : `<i class="fa-solid fa-box"></i>`
              }
            </div>

            <div>
              <div class="productName">
                ${safe(product.name || `Product ${product.id}`)}
              </div>

              <div class="productPack">
                ${safe(packText || "Unit")}
              </div>
            </div>

            <div class="productMeta">
              <div class="qty">×${qty}</div>
              <div class="linePrice">${money(totalLine)}</div>
              <div class="singlePrice">${money(eachPrice)} each</div>
            </div>

          </div>
        `;
      }).join("");
    }

    function billRows(order){
      /*
        Always show the complete bill breakdown.
        If a fee is missing or zero, it is still displayed as ₹0.
      */

      const subtotal = number(
        order.subtotal ??
        order.items_total ??
        order.cart_total ??
        order.item_total ??
        order.products_total
      );

      const deliveryFee = number(
        order.delivery_charge ??
        order.delivery_fee ??
        order.delivery_charges
      );

      const handlingFee = number(
        order.handling_fee ??
        order.handling_charges ??
        order.platform_fee
      );

      const discount = number(
        order.discount ??
        order.discount_amount ??
        order.coupon_discount
      );

      const tip = number(
        order.tip ??
        order.delivery_tip ??
        order.partner_tip
      );

      const tax = number(
        order.tax ??
        order.taxes ??
        order.gst ??
        order.tax_amount
      );

      const total = number(
        order.total_amount ??
        order.total ??
        order.grand_total
      );

      const paymentStatus = String(
        order.payment_status ??
        (order._payment === "UPI" ? "Paid / Check payment" : "Cash on delivery")
      );

      const instructions = String(
        order.delivery_instructions ??
        order.delivery_instruction ??
        order.instructions ??
        order.instruction ??
        order.order_instructions ??
        order.notes ??
        order.note ??
        ""
      ).trim();

      return `
        <div class="billRow">
          <span>Items total</span>
          <strong>${money(subtotal)}</strong>
        </div>

        <div class="billRow">
          <span>Delivery fee</span>
          <strong>${money(deliveryFee)}</strong>
        </div>

        <div class="billRow">
          <span>Handling fee</span>
          <strong>${money(handlingFee)}</strong>
        </div>

        <div class="billRow">
          <span>Taxes / GST</span>
          <strong>${money(tax)}</strong>
        </div>

        <div class="billRow">
          <span>Delivery tip</span>
          <strong>${money(tip)}</strong>
        </div>

        <div class="billRow">
          <span>Discount</span>
          <strong>${discount > 0 ? "- " : ""}${money(discount)}</strong>
        </div>

        <div class="billRow">
          <span>Payment method</span>
          <strong>${safe(order._payment || "—")}</strong>
        </div>

        <div class="billRow">
          <span>Payment status</span>
          <strong>${safe(paymentStatus)}</strong>
        </div>

        <div class="billTotal">
          <span>Total Bill</span>
          <strong>${money(total)}</strong>
        </div>

        <div style="
          margin-top:14px;
          padding-top:13px;
          border-top:1px dashed #dfe2e6;
        ">
          <div class="sectionLabel" style="margin-bottom:7px">
            Delivery Instructions
          </div>

          <div style="
            font-size:10px;
            line-height:1.55;
            color:${instructions ? "#444950" : "#92979f"};
            font-weight:${instructions ? "650" : "500"};
          ">
            ${
              instructions
                ? safe(instructions)
                : "No delivery instructions"
            }
          </div>
        </div>
      `;
    }

    function updateCounts(){
      const newOrders = orders.filter(o=>{
        return !cancelled(o) && !delivered(o);
      });

      const cancelledOrders = orders.filter(o=>{
        return cancelled(o) && !delivered(o);
      });

      newCount.textContent = newOrders.length;
      cancelledCount.textContent = cancelledOrders.length;
      bottomNewCount.textContent = newOrders.length;
      bottomCancelledCount.textContent = cancelledOrders.length;
    }

    function visibleOrders(){
      if(activeTab === "cancelled"){
        return orders.filter(order=>{
          return cancelled(order) && !delivered(order);
        });
      }

      return orders.filter(order=>{
        return !cancelled(order) && !delivered(order);
      });
    }

    function render(){
      updateCounts();

      const list = visibleOrders();

      if(!list.length){
        ordersList.innerHTML = `
          <div class="empty">
            <div class="emptyIcon">
              <i class="fa-solid ${
                activeTab === "cancelled"
                ? "fa-ban"
                : "fa-bag-shopping"
              }"></i>
            </div>

            <h3>
              ${
                activeTab === "cancelled"
                ? "No cancelled orders"
                : "No new orders"
              }
            </h3>

            <p>
              ${
                activeTab === "cancelled"
                ? "Cancelled orders from now onward will appear here."
                : "New orders placed from now onward will appear here automatically."
              }
            </p>
          </div>
        `;
        return;
      }

      ordersList.innerHTML = list.map(order=>{
        const originalIndex = orders.findIndex(x=>{
          return orderKey(x) === orderKey(order);
        });

        const status = normalizeStatus(order);
        const mobile = String(
          order.user_mobile ||
          order.mobile ||
          order.phone ||
          ""
        ).trim();

        const location = [
          order.address,
          order.village,
          order.city,
          order.pincode
        ].filter(Boolean).join(", ");

        const map = mapLink(order);

        return `
          <article class="orderItem">

            <div class="orderHead">
              <div>
                <div class="orderId">
                  Order #${safe(order.order_id ?? order.id ?? "—")}
                </div>

                <div class="orderTime">
                  ${safe(formatDate(order.created_at))}
                  &nbsp;·&nbsp;
                  ${safe(order._payment)}
                </div>
              </div>

              <div class="status ${statusClass(status)}">
                ${safe(status.replaceAll("_"," "))}
              </div>
            </div>

            <section class="customerSection">
              <div>
                <div class="sectionLabel">Customer</div>

                <div class="customerName">
                  ${safe(order.user_name || order.customer_name || "Customer")}
                </div>

                <div class="customerLine">
                  <i class="fa-solid fa-phone"></i>
                  ${
                    mobile
                    ? `<a href="tel:${safe(mobile)}">${safe(mobile)}</a>`
                    : `<span>Mobile unavailable</span>`
                  }
                </div>

                <div class="customerLine">
                  <i class="fa-solid fa-location-dot"></i>
                  <span>${safe(location || "Location unavailable")}</span>
                </div>
              </div>

              ${
                map
                ? `
                  <a
                    class="mapBtn"
                    href="${safe(map)}"
                    target="_blank"
                    rel="noopener"
                    title="Open location"
                  >
                    <i class="fa-solid fa-location-arrow"></i>
                  </a>
                `
                : ""
              }
            </section>

            <section class="productsSection">
              <div class="sectionLabel">Products</div>
              ${renderProducts(order._products)}
            </section>

            <section class="billSection">
              <div class="sectionLabel">Bill Details</div>
              ${billRows(order)}
            </section>

            <section class="statusSection">
              <div style="min-width:64px">
                <div class="sectionLabel" style="margin:0">Status</div>
              </div>
              <select
                id="status-${originalIndex}"
                class="statusSelect"
              >
                <option value="placed"
                  ${
                    ["new","placed","pending"].includes(status)
                    ? "selected"
                    : ""
                  }
                >
                  New / Placed
                </option>

                <option value="confirmed"
                  ${status === "confirmed" ? "selected" : ""}
                >
                  Confirmed
                </option>

                <option value="packed"
                  ${status === "packed" ? "selected" : ""}
                >
                  Packed
                </option>

                <option value="on_the_way"
                  ${
                    ["on_the_way","out_for_delivery"].includes(status)
                    ? "selected"
                    : ""
                  }
                >
                  On the way
                </option>

                <option value="delivered">
                  Delivered
                </option>

                <option value="cancelled"
                  ${cancelled(order) ? "selected" : ""}
                >
                  Cancelled
                </option>
              </select>

              <button
                class="updateBtn"
                onclick="updateOrderStatus(${originalIndex},this)"
              >
                Update
              </button>
            </section>

          </article>
        `;
      }).join("");
    }

    async function loadCurrentSessionOrders(){
      try{
        const results = await Promise.all(
          ORDER_TABLES.map(config=>{
            return db
              .from(config.name)
              .select("*")
              .gte("created_at",PAGE_OPENED_AT)
              .order("created_at",{ascending:false});
          })
        );

        for(let i=0;i<results.length;i++){
          const config = ORDER_TABLES[i];
          const result = results[i];

          if(result.error){
            console.error(config.name,result.error);
            continue;
          }

          for(const row of (result.data || [])){
            const full = await enrichOrder({
              ...row,
              _table:config.name,
              _payment:config.payment
            });

            addOrUpdateOrder(full);
          }
        }

        render();

      }catch(error){
        console.error(error);
        showToast(
          error.message || "Unable to load orders",
          true
        );
      }
    }

    async function handleRealtime(config,payload){
      try{
        const row = payload.new;
        if(!row) return;

        const createdAt = new Date(
          row.created_at || 0
        ).getTime();

        const pageOpened = new Date(
          PAGE_OPENED_AT
        ).getTime();

        if(createdAt && createdAt < pageOpened){
          return;
        }

        const full = await enrichOrder({
          ...row,
          _table:config.name,
          _payment:config.payment
        });

        const alreadyExists = orders.some(x=>{
          return orderKey(x) === orderKey(full);
        });

        addOrUpdateOrder(full);
        render();

        if(payload.eventType === "INSERT" && !alreadyExists){
          showToast("New order received");
        }

      }catch(error){
        console.error("Realtime error:",error);
      }
    }

    function startRealtime(){
      ORDER_TABLES.forEach(config=>{
        db
          .channel(`orders-${config.name}-${Date.now()}`)
          .on(
            "postgres_changes",
            {
              event:"*",
              schema:"public",
              table:config.name
            },
            payload=>handleRealtime(config,payload)
          )
          .subscribe(status=>{
            if(status === "CHANNEL_ERROR"){
              console.error(
                `Realtime channel error: ${config.name}`
              );
            }
          });
      });
    }

    window.updateOrderStatus = async function(index,button){
      const order = orders[index];
      if(!order) return;

      const select = document.getElementById(
        `status-${index}`
      );

      if(!select) return;

      const newStatus = select.value;
      const oldButton = button.innerHTML;

      button.disabled = true;
      button.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i>';

      try{
        const {error} = await db
          .from(order._table)
          .update({
            order_status:newStatus
          })
          .eq("id",order.id);

        if(error) throw error;

        order.order_status = newStatus;
        addOrUpdateOrder(order);
        render();

        if(newStatus === "cancelled"){
          showToast("Order moved to Cancelled");
        }else if(newStatus === "delivered"){
          showToast("Delivered order removed");
        }else{
          showToast("Order status updated");
        }

      }catch(error){
        console.error(error);

        showToast(
          error.message || "Status update failed",
          true
        );

        button.disabled = false;
        button.innerHTML = oldButton;
      }
    };

    function switchTab(tabName){
      activeTab = tabName;

      document.querySelectorAll(".tab").forEach(button=>{
        button.classList.toggle(
          "active",
          button.dataset.tab === tabName
        );
      });

      document.querySelectorAll(".bottomBtn").forEach(button=>{
        button.classList.toggle(
          "active",
          button.dataset.bottom === tabName
        );
      });

      render();
      window.scrollTo({top:0,behavior:"smooth"});
    }

    document.querySelectorAll(".tab").forEach(button=>{
      button.addEventListener("click",()=>{
        switchTab(button.dataset.tab);
      });
    });

    document.querySelectorAll(".bottomBtn").forEach(button=>{
      button.addEventListener("click",()=>{
        switchTab(button.dataset.bottom);
      });
    });

    render();
    loadCurrentSessionOrders();
    startRealtime();
  </script>
</body>
</html>
