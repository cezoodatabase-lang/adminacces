<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEZOO New Orders</title>

  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --green:#16c85c;
      --green-dark:#0a9e43;
      --green-soft:#effcf4;
      --red:#e84242;
      --red-soft:#fff1f1;
      --orange:#f59e0b;
      --blue:#2475ff;
      --purple:#7c3aed;
      --text:#17191f;
      --muted:#777d86;
      --line:#e9ebef;
      --page:#fff;
      --soft:#f7f8f9;
      --dark:#15171b;
    }

    body{
      min-height:100vh;
      background:var(--page);
      color:var(--text);
      font-family:"Inter",Arial,sans-serif;
      padding-bottom:84px;
    }

    button,select{font:inherit}
    button{cursor:pointer}

    /* TOP */
    /* TABS */
    .tabs{
      display:flex;
      align-items:center;
      gap:24px;
      padding:0 18px;
      height:54px;
      border-bottom:1px solid var(--line);
      overflow:auto;
      background:#fff;
      position:sticky;
      top:0;
      z-index:90;
    }

    .tab{
      height:54px;
      border:0;
      background:transparent;
      color:#888d96;
      position:relative;
      font-size:11px;
      font-weight:800;
      white-space:nowrap;
      display:flex;
      align-items:center;
      gap:7px;
    }

    .tab.active{
      color:var(--text);
    }

    .tab.active::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:-1px;
      height:2px;
      background:var(--green);
      border-radius:10px 10px 0 0;
    }

    .count{
      min-width:20px;
      height:20px;
      padding:0 6px;
      border-radius:999px;
      background:#f0f1f3;
      color:#666;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:9px;
    }

    .tab.active .count{
      background:var(--green-soft);
      color:var(--green-dark);
    }

    /* ORDER LIST */
    .ordersList{
      width:100%;
    }

    .orderItem{
      background:#fff;
      border-bottom:10px solid #f5f6f7;
    }

    .orderHead{
      padding:16px 18px 13px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      border-bottom:1px solid var(--line);
    }

    .orderId{
      font-size:12px;
      font-weight:800;
      line-height:1.4;
      word-break:break-word;
    }

    .orderTime{
      margin-top:4px;
      color:#8a8f97;
      font-size:9px;
    }

    .status{
      border-radius:999px;
      padding:7px 10px;
      font-size:9px;
      font-weight:800;
      text-transform:capitalize;
      white-space:nowrap;
      display:inline-flex;
      align-items:center;
      gap:6px;
    }

    .status::before{
      content:"";
      width:6px;
      height:6px;
      border-radius:50%;
      background:currentColor;
      opacity:.9;
    }

    .status.new,.status.placed,.status.pending{
      background:#edf4ff;
      color:#1769c8;
    }

    .status.confirmed,.status.packed{
      background:#f3edff;
      color:#7040c3;
    }

    .status.on_the_way,.status.out_for_delivery{
      background:#fff3e8;
      color:#c96400;
    }

    .status.cancelled,.status.canceled{
      background:var(--red-soft);
      color:var(--red);
    }

    .status.default{
      background:#f1f2f4;
      color:#60646c;
    }

    /* CUSTOMER */
    .customerSection{
      padding:14px 18px;
      border-bottom:1px solid var(--line);
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:14px;
      align-items:start;
    }

    .sectionLabel{
      font-size:8px;
      color:#989da5;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.55px;
      margin-bottom:7px;
    }

    .customerName{
      font-size:13px;
      font-weight:800;
    }

    .customerLine{
      margin-top:6px;
      color:#676c75;
      font-size:10px;
      line-height:1.5;
      display:flex;
      gap:7px;
      align-items:flex-start;
    }

    .customerLine i{
      width:13px;
      color:#8d929a;
      margin-top:2px;
    }

    .customerLine a{
      color:inherit;
      text-decoration:none;
    }

    .mapBtn{
      width:40px;
      height:40px;
      border:0;
      border-radius:50%;
      background:var(--green-soft);
      color:var(--green-dark);
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      font-size:14px;
    }

    /* PRODUCTS */
    .productsSection{
      padding:14px 18px 4px;
      border-bottom:1px solid var(--line);
    }

    .productRow{
      display:grid;
      grid-template-columns:62px minmax(0,1fr) auto;
      gap:12px;
      align-items:center;
      padding:10px 0 13px;
      border-bottom:1px solid #f0f1f3;
    }

    .productRow:last-child{
      border-bottom:0;
    }

    .productImage{
      width:62px;
      height:62px;
      border-radius:12px;
      background:#f7f8f9;
      border:1px solid #eceef1;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      color:#aaa;
    }

    .productImage img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .productName{
      font-size:11px;
      line-height:1.4;
      font-weight:800;
    }

    .productPack{
      margin-top:5px;
      color:#858a93;
      font-size:9px;
    }

    .productMeta{
      text-align:right;
      min-width:62px;
    }

    .qty{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:35px;
      height:26px;
      padding:0 8px;
      border-radius:8px;
      background:#17191d;
      color:#fff;
      font-size:9px;
      font-weight:800;
    }

    .linePrice{
      margin-top:6px;
      font-size:10px;
      font-weight:800;
      white-space:nowrap;
    }

    .singlePrice{
      margin-top:3px;
      color:#969ba3;
      font-size:8px;
      white-space:nowrap;
    }

    /* BILL */
    .billSection{
      padding:15px 18px;
      border-bottom:1px solid var(--line);
    }

    .billRow{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      padding:6px 0;
      font-size:10px;
      color:#6d727b;
    }

    .billRow strong{
      color:#2d3036;
      font-weight:750;
    }

    .billTotal{
      margin-top:7px;
      padding-top:12px;
      border-top:1px dashed #dfe2e6;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .billTotal span{
      font-size:11px;
      font-weight:800;
    }

    .billTotal strong{
      font-size:21px;
      font-weight:800;
      letter-spacing:-.4px;
    }

    /* STATUS ACTION */
    .statusSection{
      padding:14px 18px 17px;
      display:flex;
      align-items:center;
      gap:9px;
    }

    .statusSelect{
      flex:1;
      height:42px;
      border:1px solid var(--line);
      border-radius:11px;
      background:#fafafa;
      color:#333;
      padding:0 11px;
      outline:none;
      font-size:10px;
      font-weight:700;
    }

    .updateBtn{
      height:42px;
      padding:0 16px;
      border:0;
      border-radius:11px;
      background:var(--dark);
      color:#fff;
      font-size:10px;
      font-weight:800;
    }

    .updateBtn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    /* EMPTY */
    .empty{
      min-height:420px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:40px 20px;
    }

    .emptyIcon{
      width:60px;
      height:60px;
      border-radius:50%;
      background:#f3f4f5;
      color:#a1a6ae;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:21px;
      margin-bottom:13px;
    }

    .empty h3{
      font-size:15px;
      font-weight:800;
    }

    .empty p{
      max-width:320px;
      margin-top:6px;
      color:#888d95;
      font-size:10px;
      line-height:1.5;
    }

    /* BOTTOM NAV */
    .bottomNav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      height:72px;
      background:#fff;
      border-top:1px solid var(--line);
      display:grid;
      grid-template-columns:1fr 1fr;
      z-index:200;
    }

    .bottomBtn{
      border:0;
      background:#fff;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
      color:#92979f;
      font-size:9px;
      font-weight:800;
      position:relative;
    }

    .bottomBtn i{
      font-size:17px;
    }

    .bottomBtn.active{
      color:var(--green-dark);
    }

    .bottomBtn.active::before{
      content:"";
      width:24px;
      height:3px;
      border-radius:999px;
      background:var(--green);
      position:absolute;
      top:0;
    }

    .bottomBadge{
      position:absolute;
      top:8px;
      margin-left:25px;
      min-width:17px;
      height:17px;
      padding:0 5px;
      border-radius:999px;
      background:#ef4444;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:7px;
      font-weight:800;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:88px;
      z-index:500;
      transform:translate(-50%,20px);
      background:#17191d;
      color:#fff;
      padding:11px 15px;
      border-radius:11px;
      font-size:10px;
      font-weight:750;
      opacity:0;
      visibility:hidden;
      transition:.2s;
      max-width:calc(100% - 28px);
      text-align:center;
    }

    .toast.show{
      opacity:1;
      visibility:visible;
      transform:translate(-50%,0);
    }

    .toast.error{
      background:#d93636;
    }

    @media(min-width:850px){
      body{background:#f5f6f8}
      .tabs,.ordersList{
        max-width:900px;
        margin-left:auto;
        margin-right:auto;
      }
      .tabs,.ordersList{background:#fff}
      .ordersList{border-left:1px solid var(--line);border-right:1px solid var(--line)}
      .bottomNav{
        left:50%;
        transform:translateX(-50%);
        max-width:900px;
        border-left:1px solid var(--line);
        border-right:1px solid var(--line);
      }
    }

    .productRow .productPack + .productPack{
      margin-top:3px;
    }


    /* APPROVED DELIVERY PARTNER DISPATCH */
    .dispatchSection{
      padding:14px 18px 17px;
      border-bottom:1px solid var(--line);
      background:#fff;
    }

    .dispatchHead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom:9px;
    }

    .dispatchTitle{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:11px;
      font-weight:800;
      color:#22262c;
    }

    .dispatchTitle i{color:var(--green-dark)}

    .dispatchState{
      font-size:8px;
      font-weight:800;
      color:#7d838c;
      text-align:right;
      line-height:1.45;
    }

    .dispatchState.assigned{color:var(--green-dark)}

    .dispatchGrid{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:8px;
      align-items:center;
    }

    .dispatchSelect{
      width:100%;
      height:42px;
      border:1px solid var(--line);
      border-radius:11px;
      background:#fafafa;
      color:#333;
      padding:0 11px;
      outline:none;
      font-size:10px;
      font-weight:700;
    }

    .dispatchBtn{
      height:42px;
      min-width:108px;
      padding:0 14px;
      border:0;
      border-radius:11px;
      background:var(--dark);
      color:#fff;
      font-size:10px;
      font-weight:800;
      white-space:nowrap;
    }

    .dispatchBtn.reassign{
      background:#eef1f4;
      color:#222;
    }

    .dispatchBtn:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .cancelPartnerBtn{
      width:100%;
      height:38px;
      margin-top:8px;
      border:1px solid #f1cccc;
      border-radius:10px;
      background:#fff;
      color:var(--red);
      font-size:9px;
      font-weight:800;
    }

    .cancelPartnerBtn:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .dispatchHint{
      margin-top:7px;
      color:#92979f;
      font-size:8px;
      line-height:1.45;
    }

    .productIdText{
      margin-top:4px;
      color:#9aa0a8;
      font-size:8px;
      font-weight:700;
    }

    @media(max-width:520px){
      .dispatchGrid{grid-template-columns:1fr}
      .dispatchBtn{width:100%}
    }

  </style>
</head>
<body>

  <nav class="tabs">
    <button class="tab active" type="button" data-tab="new">
      New Orders <span class="count" id="newCount">0</span>
    </button>
    <button class="tab" type="button" data-tab="cancelled">
      Cancelled <span class="count" id="cancelledCount">0</span>
    </button>
  </nav>

  <main id="ordersList" class="ordersList"></main>

  <nav class="bottomNav">
    <button class="bottomBtn active" type="button" data-bottom="new">
      <i class="fa-solid fa-bag-shopping"></i>
      <span>Orders</span>
      <span class="bottomBadge" id="bottomNewCount">0</span>
    </button>

    <button class="bottomBtn" type="button" data-bottom="cancelled">
      <i class="fa-solid fa-ban"></i>
      <span>Cancelled</span>
      <span class="bottomBadge" id="bottomCancelledCount">0</span>
    </button>
  </nav>

  <div id="toast" class="toast"></div>

  <script>
    const SUPABASE_URL = "https://ycqwdeiykbkfmmlpgdzd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-4RzQVudUy_VsvSpHTxNfg_hrdsQW0j";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TODAY_STARTED_AT = (() => {
      const now = new Date();
      now.setHours(0,0,0,0);
      return now.toISOString();
    })();

    const ORDER_TABLES = [
      {name:"cash_delivery_orders", payment:"Cash"},
      {name:"upi_orders", payment:"UPI"}
    ];

    const DELIVERY_TABLES = {
      cash_delivery_orders:"delivery_cash_orders",
      upi_orders:"delivery_upi_orders"
    };

    let activeTab = "new";
    let orders = [];
    let deliveryRows = [];
    let approvedPartners = [];
    const productCache = {};

    const ordersList = document.getElementById("ordersList");
    const newCount = document.getElementById("newCount");
    const cancelledCount = document.getElementById("cancelledCount");
    const bottomNewCount = document.getElementById("bottomNewCount");
    const bottomCancelledCount = document.getElementById("bottomCancelledCount");
    const toast = document.getElementById("toast");

    function safe(value){
      return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function number(value){
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    }

    function money(value){
      return "₹" + number(value).toLocaleString("en-IN",{
        minimumFractionDigits:0,
        maximumFractionDigits:2
      });
    }

    function normalizeStatus(order){
      return String(order.order_status || order.status || "placed")
        .trim()
        .toLowerCase()
        .replaceAll(" ","_");
    }

    function cancelled(order){
      return ["cancelled","canceled"].includes(normalizeStatus(order));
    }

    function delivered(order){
      return normalizeStatus(order) === "delivered";
    }

    function showToast(message,error=false){
      toast.textContent = message;
      toast.classList.toggle("error",error);
      toast.classList.add("show");

      clearTimeout(toast.timer);
      toast.timer = setTimeout(()=>{
        toast.classList.remove("show");
      },2200);
    }

    function statusClass(status){
      const allowed = [
        "new","placed","pending","confirmed","packed",
        "on_the_way","out_for_delivery","cancelled","canceled"
      ];
      return allowed.includes(status) ? status : "default";
    }

    function formatDate(value){
      if(!value) return "Just now";

      const d = new Date(value);
      if(Number.isNaN(d.getTime())) return "";

      return d.toLocaleString("en-IN",{
        day:"2-digit",
        month:"short",
        hour:"2-digit",
        minute:"2-digit"
      });
    }

    function orderKey(order){
      return `${order._table}:${order.id ?? order.order_id}`;
    }

    function cleanMobile(value){
      return String(value ?? "")
        .replace(/\D/g,"")
        .slice(-10);
    }

    function deliveryTableForOrder(order){
      return DELIVERY_TABLES[order?._table] || "";
    }

    function orderNumber(order){
      return String(order?.order_id ?? order?.id ?? "");
    }

    function deliveryRowForOrder(order){
      const targetId = orderNumber(order);
      const targetTable = deliveryTableForOrder(order);

      return deliveryRows.find(row=>{
        return (
          String(row.order_id ?? row.source_order_id ?? "") === targetId &&
          row._delivery_table === targetTable
        );
      }) || null;
    }

    function currentAssignedPartner(order){
      const row = deliveryRowForOrder(order);

      if(!row){
        return {
          assigned:false,
          id:"",
          name:"",
          mobile:"",
          status:""
        };
      }

      const name = String(
        row.delivery_boy_name ??
        row.delivery_partner_name ??
        row.partner_name ??
        ""
      ).trim();

      const mobile = cleanMobile(
        row.delivery_boy_mobile ??
        row.delivery_partner_mobile ??
        row.partner_mobile ??
        ""
      );

      const id = String(
        row.delivery_boy_id ??
        row.delivery_partner_id ??
        ""
      ).trim();

      const status = String(
        row.delivery_status || "assigned"
      ).trim().toLowerCase();

      return {
        assigned:Boolean(
          name ||
          mobile ||
          row.delivery_boy_accepted === true
        ),
        id,
        name,
        mobile,
        status
      };
    }

    function activeOrdersForPartner(mobileNumber){
      const m = cleanMobile(mobileNumber);

      return deliveryRows.filter(row=>{
        const rowMobile = cleanMobile(
          row.delivery_boy_mobile ??
          row.delivery_partner_mobile ??
          ""
        );

        const status = String(
          row.delivery_status || ""
        ).trim().toLowerCase();

        return (
          rowMobile === m &&
          row.delivery_boy_accepted === true &&
          !["delivered","cancelled","canceled"].includes(status)
        );
      }).length;
    }

    function dispatchOptionLabel(partner){
      const active = activeOrdersForPartner(partner.mobile);

      return `${partner.name} · +91 ${partner.mobile} · ${
        active ? `${active} active` : "Available"
      }`;
    }

    function partnerOptions(order){
      const current = currentAssignedPartner(order);
      const currentMobile = cleanMobile(current.mobile);

      return `
        <option value="">Choose a delivery partner</option>
        ${approvedPartners.map(partner=>`
          <option
            value="${safe(partner.mobile)}"
            ${currentMobile && currentMobile === partner.mobile ? "selected" : ""}
          >
            ${safe(dispatchOptionLabel(partner))}
          </option>
        `).join("")}
      `;
    }

    async function loadDeliveryDispatchData(){
      try{
        const [applications,cash,upi] = await Promise.all([
          db
            .from("delivery_partner_applications")
            .select("*")
            .eq("status","approved"),

          db
            .from("delivery_cash_orders")
            .select("*"),

          db
            .from("delivery_upi_orders")
            .select("*")
        ]);

        if(applications.error){
          console.error(
            "delivery_partner_applications:",
            applications.error
          );
        }

        if(cash.error){
          console.error("delivery_cash_orders:",cash.error);
        }

        if(upi.error){
          console.error("delivery_upi_orders:",upi.error);
        }

        deliveryRows = [
          ...(cash.data || []).map(row=>({
            ...row,
            _delivery_table:"delivery_cash_orders"
          })),
          ...(upi.data || []).map(row=>({
            ...row,
            _delivery_table:"delivery_upi_orders"
          }))
        ];

        approvedPartners = (applications.data || [])
          .map(application=>{
            const mobile = cleanMobile(application.mobile);

            const name = String(
              application.full_name ??
              application.name ??
              application.delivery_boy_name ??
              "Delivery Partner"
            ).trim();

            const partnerId = String(
              application.delivery_boy_uuid ??
              application.delivery_boy_id ??
              application.id ??
              mobile
            );

            return {
              application,
              mobile,
              name,
              partnerId
            };
          })
          .filter(partner=>partner.mobile)
          .sort((a,b)=>{
            const activeDiff =
              activeOrdersForPartner(a.mobile) -
              activeOrdersForPartner(b.mobile);

            if(activeDiff !== 0) return activeDiff;

            return a.name.localeCompare(b.name);
          });

      }catch(error){
        console.error(
          "Delivery dispatch data load error:",
          error
        );
      }
    }

    function addOrUpdateOrder(order){
      const key = orderKey(order);
      const index = orders.findIndex(x=>orderKey(x)===key);

      if(index >= 0){
        orders[index] = order;
      }else{
        orders.unshift(order);
      }

      orders.sort((a,b)=>{
        return new Date(b.created_at || 0) - new Date(a.created_at || 0);
      });
    }

    function mapLink(order){
      const lat = Number(order.latitude);
      const lng = Number(order.longitude);

      if(Number.isFinite(lat) && Number.isFinite(lng) && lat !== 0 && lng !== 0){
        return `https://www.google.com/maps?q=${encodeURIComponent(lat)},${encodeURIComponent(lng)}`;
      }

      const place = [
        order.address,
        order.village,
        order.city,
        order.pincode
      ].filter(Boolean).join(", ");

      if(!place) return "";

      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place)}`;
    }


    /* =========================================================
       ALL PRODUCT TABLE SUPPORT

       The order item already contains the exact `product_table`.
       Admin now loads that exact row with select("*") so every
       table can use its own real column names.

       Known CEZOO product tables handled:
       - cezoogroceries
       - fresh_products
       - icecreams
       - food_items
       - restaurant_food_items
       - cakes
       - cezoocafe

       Any future table saved in order.items.product_table also works
       because the loader does not use one hard-coded SELECT anymore.
    ========================================================= */

    function normalizeProductTable(value){
      return String(value || "")
        .trim()
        .toLowerCase();
    }

    function firstValue(object, keys, fallback=""){
      if(!object) return fallback;

      for(const key of keys){
        if(
          Object.prototype.hasOwnProperty.call(object,key) &&
          object[key] !== null &&
          object[key] !== undefined &&
          String(object[key]).trim() !== ""
        ){
          return object[key];
        }
      }

      return fallback;
    }

    function firstImageValue(value){
      if(!value) return "";

      if(Array.isArray(value)){
        const first = value.find(v=>typeof v === "string" && v.trim());
        return first ? first.trim() : "";
      }

      if(typeof value === "object"){
        return String(
          value.url ||
          value.src ||
          value.image ||
          ""
        ).trim();
      }

      const raw = String(value).trim();

      if(raw.startsWith("[") || raw.startsWith("{")){
        try{
          return firstImageValue(JSON.parse(raw));
        }catch(error){}
      }

      return raw;
    }

    function productImage(product){
      const candidates = [
        product?.image1,
        product?.image,
        product?.image_url,
        product?.product_image,
        product?.product_image_url,
        product?.food_image,
        product?.dish_image,
        product?.photo,
        product?.photo_url,
        product?.thumbnail,
        product?.thumbnail_url,
        product?.picture,
        product?.picture_url,
        product?.main_image,
        product?.cover_image,
        product?.images,
        product?.product_images,
        product?.gallery,
        product?.photos
      ];

      for(const value of candidates){
        const image = firstImageValue(value);
        if(image) return image;
      }

      return "";
    }

    function productName(product){
      const table = normalizeProductTable(product?.product_table);

      if(table === "icecreams"){
        return String(
          product?.name ||
          `Product ${product?.id ?? ""}`
        ).trim();
      }

      if(
        table === "food_items" ||
        table === "restaurant_food_items"
      ){
        return String(
          product?.product_name ||
          product?.item_name ||
          product?.name ||
          `Product ${product?.id ?? ""}`
        ).trim();
      }

      if(table === "cakes"){
        return String(
          product?.cake_name ||
          product?.name ||
          product?.product_name ||
          `Cake ${product?.id ?? ""}`
        ).trim();
      }

      return String(
        firstValue(
          product,
          [
            "name",
            "product_name",
            "item_name",
            "food_name",
            "dish_name",
            "restaurant_item_name",
            "cake_name",
            "title"
          ],
          `Product ${product?.id ?? ""}`
        )
      ).trim();
    }

    function productSecondaryText(product){
      const table = normalizeProductTable(product?.product_table);

      if(table === "icecreams"){
        return String(product?.name_telugu || "").trim();
      }

      if(
        table === "food_items" ||
        table === "restaurant_food_items"
      ){
        const productNameValue = String(product?.product_name || "").trim();
        const itemName = String(product?.item_name || "").trim();
        const description = String(product?.short_description || "").trim();

        return [itemName, description]
          .filter(value=>{
            if(!value) return false;
            if(
              productNameValue &&
              value.toLowerCase() === productNameValue.toLowerCase()
            ){
              return false;
            }
            return true;
          })
          .join(" • ");
      }

      if(table === "cakes"){
        const item = product?._orderItem || {};

        const cakeName = String(
          item.cake_name_text ??
          item.cake_name ??
          ""
        ).trim();

        return cakeName
          ? `Cake Name: ${cakeName}`
          : "";
      }

      return String(
        firstValue(
          product,
          [
            "name_telugu",
            "telugu_name",
            "short_description",
            "description",
            "sub_txt"
          ],
          ""
        )
      ).trim();
    }

    function parseCakePrices(value){
      if(
        value &&
        typeof value === "object" &&
        !Array.isArray(value)
      ){
        return value;
      }

      try{
        const parsed = JSON.parse(value || "{}");
        return (
          parsed &&
          typeof parsed === "object" &&
          !Array.isArray(parsed)
        )
          ? parsed
          : {};
      }catch(error){
        return {};
      }
    }

    function cakeVariantPrice(product){
      const item = product?._orderItem || {};
      const type = String(item.cake_type || "").trim();
      const weight = String(item.cake_weight || "").trim();

      const prices = parseCakePrices(product?.prices);

      if(
        type &&
        weight &&
        prices?.[type] &&
        prices[type]?.[weight] !== undefined
      ){
        const value = number(prices[type][weight]);
        if(value > 0) return value;
      }

      const simple = number(product?.price);
      if(simple > 0) return simple;

      return 0;
    }

    function productUnitPrice(product){
      const table = normalizeProductTable(product?.product_table);

      if(table === "cakes"){
        return cakeVariantPrice(product);
      }

      const values = [
        product?.discount_price,
        product?.selling_price,
        product?.sale_price,
        product?.offer_price,
        product?.price,
        product?.original_price,
        product?.mrp
      ];

      for(const value of values){
        const n = Number(value);
        if(Number.isFinite(n)) return n;
      }

      return 0;
    }

    function productPackText(product){
      const table = normalizeProductTable(product?.product_table);
      const item = product?._orderItem || {};

      if(table === "cakes"){
        const parts = [
          item.cake_type,
          item.cake_weight
        ].filter(Boolean);

        if(parts.length){
          return parts.join(" • ");
        }

        return String(product?.sub_txt || "Cake").trim();
      }

      if(table === "icecreams"){
        return [
          product?.quantity,
          product?.unit
        ]
        .filter(v=>v !== null && v !== undefined && String(v).trim() !== "")
        .join(" ");
      }

      if(
        table === "food_items" ||
        table === "restaurant_food_items"
      ){
        return String(
          product?.short_description ||
          product?.item_name ||
          ""
        ).trim();
      }

      if(
        table === "cezoogroceries" ||
        table === "fresh_products"
      ){
        const quantity = firstValue(
          product,
          [
            "product_quantity",
            "net_quantity",
            "net_weight",
            "weight",
            "quantity_value",
            "qty_value",
            "pack_quantity",
            "quantity",
            "qty"
          ],
          ""
        );

        const unit = firstValue(
          product,
          [
            "product_unit",
            "weight_unit",
            "measurement_unit",
            "quantity_unit",
            "pack_unit",
            "unit",
            "units",
            "uom"
          ],
          ""
        );

        return [quantity,unit]
          .filter(v=>v !== null && v !== undefined && String(v).trim() !== "")
          .join(" ");
      }

      const quantity = firstValue(
        product,
        [
          "quantity",
          "product_quantity",
          "food_quantity",
          "icecream_quantity",
          "net_quantity",
          "net_weight",
          "weight",
          "pack_size",
          "size",
          "volume"
        ],
        ""
      );

      const unit = firstValue(
        product,
        [
          "unit",
          "product_unit",
          "quantity_unit",
          "weight_unit",
          "measurement_unit",
          "units",
          "uom"
        ],
        ""
      );

      return [quantity,unit]
        .filter(v=>v !== null && v !== undefined && String(v).trim() !== "")
        .join(" ");
    }


    async function fetchProducts(items){
      if(!Array.isArray(items) || !items.length) return [];

      const grouped = {};

      for(const item of items){
        const table = normalizeProductTable(
          item.product_table ||
          item.table_name ||
          item.table ||
          ""
        );

        const rawId =
          item.product_id ??
          item.productId ??
          item.id;

        const id = Number(rawId);

        const qty = number(
          item.qty ??
          item.quantity ??
          item.count ??
          item.ordered_qty ??
          1
        ) || 1;

        if(
          !table ||
          !Number.isFinite(id)
        ){
          console.warn(
            "Admin product skipped: missing product_table/product_id",
            item
          );
          continue;
        }

        if(!grouped[table]){
          grouped[table] = [];
        }

        grouped[table].push({
          id,
          qty,
          item
        });
      }

      const finalProducts = [];

      for(const [table, rows] of Object.entries(grouped)){
        const ids = [
          ...new Set(
            rows.map(x=>x.id)
          )
        ];

        const missingIds = ids.filter(id=>{
          return !productCache[`${table}_${id}`];
        });

        if(missingIds.length){
          /*
            IMPORTANT:
            Do NOT use one fixed select list here.
            Every CEZOO product table has different columns.
            select("*") lets admin load the exact real row.
          */
          const {data,error} = await db
            .from(table)
            .select("*")
            .in("id",missingIds);

          if(error){
            console.error(
              "Product load error:",
              table,
              error
            );
          }else{
            for(const product of (data || [])){
              productCache[`${table}_${product.id}`] = {
                ...product,
                product_table:table
              };
            }
          }
        }

        for(const row of rows){
          const product =
            productCache[
              `${table}_${row.id}`
            ];

          if(product){
            finalProducts.push({
              ...product,
              product_table:table,
              ordered_qty:row.qty,
              _orderItem:row.item
            });
          }else{
            /*
              Even if a table/row cannot be loaded,
              still show the data already saved inside order.items.
            */
            finalProducts.push({
              ...row.item,
              id:row.id,
              product_id:row.id,
              product_table:table,
              ordered_qty:row.qty,
              _orderItem:row.item,
              _missing:true
            });
          }
        }
      }

      return finalProducts;
    }

    async function enrichOrder(order){
      const items = Array.isArray(order.items) ? order.items : [];
      order._products = await fetchProducts(items);
      return order;
    }

    function renderProducts(products){
      if(!products || !products.length){
        return `

          </div>

      return products.map(product=>{
        const qty =
          number(
            product.ordered_qty
          ) || 1;

        const name =
          productName(product);

        const image =
          productImage(product);

        const secondary =
          productSecondaryText(product);

        const packText =
          productPackText(product);

        /*
          If the live product row could not be loaded, use the
          price captured inside order.items before showing ₹0.
        */
        let eachPrice =
          productUnitPrice(product);

        if(!eachPrice){
          eachPrice = number(
            product?._orderItem?.unit_price ??
            product?._orderItem?.discount_price ??
            product?._orderItem?.price ??
            product?.unit_price ??
            product?.discount_price ??
            product?.price
          );
        }

        let totalLine = number(
          product?._orderItem?.total_price ??
          product?.total_price
        );

        if(!totalLine){
          totalLine =
            eachPrice *
            qty;
        }

        return `
          <div class="productRow">

                image
                ? `

      bottomNewCount.textContent = newOrders.length;

    }

    async function loadTodayOrders(){
      try{
        const results = await Promise.all(
          ORDER_TABLES.map(config=>{
            return db
              .from(config.name)
              .select("*")
              .gte("created_at",TODAY_STARTED_AT)
              .order("created_at",{ascending:false});
          })
        );

        for(let i=0;i<results.length;i++){
          const config = ORDER_TABLES[i];
          const result = results[i];

          if(result.error){
            console.error(config.name,result.error);
            continue;
          }

          for(const row of (result.data || [])){
            const full = await enrichOrder({
              ...row,
              _table:config.name,
              _payment:config.payment
            });

            addOrUpdateOrder(full);
          }
        }

        render();

      }catch(error){
        console.error(error);
        showToast(
          error.message || "Unable to load orders",
          true
        );
      }
    }

    async function handleRealtime(config,payload){
      try{
        const row =
          payload.new && Object.keys(payload.new).length
            ? payload.new
            : payload.old;

        if(!row) return;

        const createdAt = new Date(
          row.created_at || 0
        ).getTime();

        const todayStarted = new Date(
          TODAY_STARTED_AT
        ).getTime();

        // Ignore only orders older than today.
        // Refreshing or reopening the page will still restore today's orders.
        if(createdAt && createdAt < todayStarted){
          return;
        }

        const full = await enrichOrder({
          ...row,
          _table:config.name,
          _payment:config.payment
        });

        const alreadyExists = orders.some(x=>{
          return orderKey(x) === orderKey(full);
        });

        addOrUpdateOrder(full);
        render();

        if(payload.eventType === "INSERT" && !alreadyExists){
          showToast("New order received");
        }

      }catch(error){
        console.error("Realtime error:",error);
      }
    }

    function startRealtime(){
      ORDER_TABLES.forEach(config=>{
        db
          .channel(`orders-${config.name}-${Date.now()}`)
          .on(
            "postgres_changes",
            {
              event:"*",
              schema:"public",
              table:config.name
            },
            payload=>handleRealtime(config,payload)
          )
          .subscribe(status=>{
            if(status === "CHANNEL_ERROR"){
              console.error(
                `Realtime channel error: ${config.name}`
              );
            }
          });
      });
    }


    function unsupportedDeliveryColumnFromError(error){
      const message = String(error?.message || "");

      const patterns = [
        /Could not find the ['"]([^'"]+)['"] column/i,
        /column ['"]?([^'".\s]+)['"]? .* does not exist/i,
        /column .*?\.([^.\s]+) does not exist/i
      ];

      for(const pattern of patterns){
        const match = message.match(pattern);

        if(match && match[1]){
          return match[1];
        }
      }

      return "";
    }

    async function createDeliveryRowSafely(
      deliveryTable,
      rawPayload
    ){
      /*
        Customer-order tables can have columns that do not exist
        in delivery_* tables (example: low_cart_fee).

        Insert a copy and, only when Supabase reports an unsupported
        column, remove that column and retry. This is the same robust
        pattern used by the working CEZOO admin dashboard.
      */
      const safePayload = {...rawPayload};
      const removedColumns = [];

      for(let attempt = 0; attempt < 45; attempt++){
        const {
          data,
          error
        } = await db
          .from(deliveryTable)
          .insert(safePayload)
          .select("*")
          .maybeSingle();

        if(!error){
          if(removedColumns.length){
            console.info(
              "Delivery row skipped unsupported columns:",
              removedColumns
            );
          }

          return data || safePayload;
        }

        const unsupportedColumn =
          unsupportedDeliveryColumnFromError(error);

        if(
          unsupportedColumn &&
          Object.prototype.hasOwnProperty.call(
            safePayload,
            unsupportedColumn
          )
        ){
          delete safePayload[unsupportedColumn];
          removedColumns.push(unsupportedColumn);
          continue;
        }

        throw error;
      }

      throw new Error(
        "Could not prepare delivery row because too many unsupported columns were found"
      );
    }


    window.dispatchOrderToPartner = async function(index,button){
      const order = orders[index];

      if(!order || !button){
        return;
      }

      const select =
        document.getElementById(`dispatch-${index}`);

      const selectedMobile =
        cleanMobile(select?.value || "");

      if(!selectedMobile){
        showToast(
          "Select a delivery partner first",
          true
        );
        return;
      }

      const partner =
        approvedPartners.find(item=>{
          return item.mobile === selectedMobile;
        });

      if(!partner){
        showToast(
          "Selected partner is not approved",
          true
        );
        return;
      }

      const deliveryTable =
        deliveryTableForOrder(order);

      if(!deliveryTable){
        showToast(
          "Delivery table not configured",
          true
        );
        return;
      }

      const oldHtml = button.innerHTML;

      button.disabled = true;
      button.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Sending';

      try{
        /*
          1) Ensure delivery row exists.
          2) Assign approved partner directly.
          3) Sync same partner to original customer order.
        */

        let deliveryRow =
          deliveryRowForOrder(order);

        if(!deliveryRow){
          const payload = {...order};

          delete payload._table;
          delete payload._payment;
          delete payload._products;

          /*
            These are customer-order/admin-only fields and must not be
            copied into delivery tables.
          */
          delete payload.low_cart_fee;

          payload.source_order_id =
            orderNumber(order);

          payload.source_order_type =
            order._table === "upi_orders"
              ? "upi"
              : "cash";

          payload.sent_to_delivery_at =
            new Date().toISOString();

          payload.delivery_status =
            "assigned";

          payload.delivery_boy_accepted =
            false;

          /*
            IMPORTANT:
            Do not directly upsert the full customer-order object.
            Some customer columns (for example low_cart_fee) are not
            present in delivery_* tables.

            createDeliveryRowSafely() removes only unsupported columns
            reported by Supabase and retries automatically.
          */
          const createdDeliveryRow =
            await createDeliveryRowSafely(
              deliveryTable,
              payload
            );

          deliveryRow = {
            ...createdDeliveryRow,
            _delivery_table:deliveryTable
          };

          deliveryRows.unshift(deliveryRow);
        }

        const deliveryUpdate = {
          delivery_boy_accepted:true,
          delivery_boy_id:String(partner.partnerId),
          delivery_boy_name:String(partner.name),
          delivery_boy_mobile:String(partner.mobile),
          delivery_status:"accepted"
        };

        const deliveryResult =
          await db
            .from(deliveryTable)
            .update(deliveryUpdate)
            .eq(
              "order_id",
              orderNumber(order)
            )
            .select("*")
            .maybeSingle();

        if(deliveryResult.error){
          throw deliveryResult.error;
        }

        if(!deliveryResult.data){
          throw new Error(
            "Delivery order was not found"
          );
        }

        const customerUpdate = {
          delivery_boy_accepted:true,
          delivery_boy_id:String(partner.partnerId),
          delivery_boy_name:String(partner.name),
          delivery_boy_mobile:String(partner.mobile),
          order_status:"delivery_boy_assigned"
        };

        const customerResult =
          await db
            .from(order._table)
            .update(customerUpdate)
            .eq(
              "order_id",
              orderNumber(order)
            )
            .select("*")
            .maybeSingle();

        if(customerResult.error){
          throw new Error(
            "Delivery assigned, but customer order sync failed: " +
            customerResult.error.message
          );
        }

        const deliveryIndex =
          deliveryRows.findIndex(row=>{
            return (
              String(
                row.order_id ??
                row.source_order_id ??
                ""
              ) === orderNumber(order) &&
              row._delivery_table === deliveryTable
            );
          });

        const updatedDelivery = {
          ...deliveryResult.data,
          _delivery_table:deliveryTable
        };

        if(deliveryIndex >= 0){
          deliveryRows[deliveryIndex] =
            updatedDelivery;
        }else{
          deliveryRows.unshift(
            updatedDelivery
          );
        }

        Object.assign(
          order,
          customerResult.data ||
          customerUpdate
        );

        showToast(
          `Order sent to ${partner.name}`
        );

        render();

      }catch(error){
        console.error(
          "Dispatch delivery error:",
          error
        );

        button.disabled = false;
        button.innerHTML = oldHtml;

        showToast(
          error.message ||
          "Unable to assign delivery partner",
          true
        );
      }
    };


    window.cancelDeliveryPartner = async function(index,button){
      const order = orders[index];

      if(!order || !button){
        return;
      }

      const deliveryTable =
        deliveryTableForOrder(order);

      const deliveryRow =
        deliveryRowForOrder(order);

      if(!deliveryTable || !deliveryRow){
        showToast(
          "No delivery partner assigned",
          true
        );
        return;
      }

      const status = String(
        deliveryRow.delivery_status || ""
      ).trim().toLowerCase();

      if(
        ["delivered","cancelled","canceled"]
          .includes(status)
      ){
        showToast(
          "Completed delivery cannot be unassigned",
          true
        );
        return;
      }

      const oldHtml = button.innerHTML;

      button.disabled = true;
      button.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Cancelling';

      try{
        /*
          Cancel only the assigned partner.
          Keep the delivery row available for another rider.
        */
        const deliveryUpdate = {
          delivery_boy_accepted:false,
          delivery_boy_id:null,
          delivery_boy_name:null,
          delivery_boy_mobile:null,
          delivery_status:"assigned"
        };

        const deliveryResult =
          await db
            .from(deliveryTable)
            .update(deliveryUpdate)
            .eq(
              "order_id",
              orderNumber(order)
            )
            .select("*")
            .maybeSingle();

        if(deliveryResult.error){
          throw deliveryResult.error;
        }

        const customerUpdate = {
          delivery_boy_accepted:false,
          delivery_boy_id:null,
          delivery_boy_name:null,
          delivery_boy_mobile:null,
          order_status:"packed"
        };

        const customerResult =
          await db
            .from(order._table)
            .update(customerUpdate)
            .eq(
              "order_id",
              orderNumber(order)
            )
            .select("*")
            .maybeSingle();

        if(customerResult.error){
          throw new Error(
            "Partner cancelled, but customer order sync failed: " +
            customerResult.error.message
          );
        }

        const deliveryIndex =
          deliveryRows.findIndex(row=>{
            return (
              String(
                row.order_id ??
                row.source_order_id ??
                ""
              ) === orderNumber(order) &&
              row._delivery_table === deliveryTable
            );
          });

        if(deliveryIndex >= 0){
          deliveryRows[deliveryIndex] = {
            ...(deliveryResult.data ||
              deliveryUpdate),
            _delivery_table:deliveryTable
          };
        }

        Object.assign(
          order,
          customerResult.data ||
          customerUpdate
        );

        showToast(
          "Delivery partner cancelled"
        );

        render();

      }catch(error){
        console.error(
          "Cancel delivery partner error:",
          error
        );

        button.disabled = false;
        button.innerHTML = oldHtml;

        showToast(
          error.message ||
          "Unable to cancel delivery partner",
          true
        );
      }
    };


    window.updateOrderStatus = async function(index,button){
      const order = orders[index];
      if(!order) return;

      const select = document.getElementById(
        `status-${index}`
      );

      if(!select) return;

      const newStatus = select.value;
      const oldButton = button.innerHTML;

      button.disabled = true;
      button.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i>';

      try{
        const {error} = await db
          .from(order._table)
          .update({
            order_status:newStatus
          })
          .eq("id",order.id);

        if(error) throw error;

        order.order_status = newStatus;
        addOrUpdateOrder(order);
        render();

        if(newStatus === "cancelled"){
          showToast("Order moved to Cancelled");
        }else if(newStatus === "delivered"){
          showToast("Delivered order removed");
        }else{
          showToast("Order status updated");
        }

      }catch(error){
        console.error(error);

        showToast(
          error.message || "Status update failed",
          true
        );

        button.disabled = false;
        button.innerHTML = oldButton;
      }
    };

    function switchTab(tabName){
      activeTab = tabName;

      document.querySelectorAll(".tab").forEach(button=>{
        button.classList.toggle(
          "active",
          button.dataset.tab === tabName
        );
      });

      document.querySelectorAll(".bottomBtn").forEach(button=>{
        button.classList.toggle(
          "active",
          button.dataset.bottom === tabName
        );
      });

      render();
      window.scrollTo({top:0,behavior:"smooth"});
    }

    document.querySelectorAll(".tab").forEach(button=>{
      button.addEventListener("click",()=>{
        switchTab(button.dataset.tab);
      });
    });

    document.querySelectorAll(".bottomBtn").forEach(button=>{
      button.addEventListener("click",()=>{
        switchTab(button.dataset.bottom);
      });
    });

    async function startApp(){
      await loadDeliveryDispatchData();
      render();
      await loadTodayOrders();
      startRealtime();
    }

    startApp();
  </script>
